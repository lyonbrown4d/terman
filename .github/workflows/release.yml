name: Release packages

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "docker/**"
      - ".dockerignore"
      - "go.work*"
      - "common/**"
      - "screen/**"
      - "tmux/**"
      - "htop/**"
      - "testkit/**"
  workflow_dispatch:
    inputs:
      installer_lifecycle:
        description: "Run real installers on disposable runners (changes host services/accounts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TERMAN_TEST_UPX: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4
        if: matrix.os != 'windows-11-arm'
        with:
          install-only: true
          version: latest
      - name: Install official UPX tool on Windows ARM64
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: ./packaging/windows/Install-Upx.ps1
      - name: Test workspace and UPX-compressed real process integration
        run: go test -tags=integration -timeout=15m ./common/... ./screen/... ./tmux/... ./htop/... ./testkit/...

  packages:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      TERMAN_RELEASE_DIR: ${{ github.workspace }}/../terman-release
    steps:
      - name: Require WiX acceptance before publishing a complete tagged release
        if: startsWith(github.ref, 'refs/tags/v') && vars.TERMAN_ACCEPT_WIX_EULA != 'true'
        shell: bash
        run: |
          echo '::error title=Release blocked::A complete release includes MSI installers. Review https://docs.firegiant.com/wix/osmf/ and set TERMAN_ACCEPT_WIX_EULA=true before publishing.'
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4
        with:
          install-only: true
          version: latest
      - name: Authenticate GHCR for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify UPX integrity before publication
        shell: bash
        run: |
          count=0
          while IFS= read -r -d '' binary; do
            upx --test "$binary"
            count=$((count + 1))
          done < <(find "$TERMAN_RELEASE_DIR" -mindepth 2 -maxdepth 2 -type f -name 'terman-*' -print0)
          test "$count" -eq 12
      - name: Smoke test container binaries on both architectures
        shell: bash
        run: |
          version=$(jq -r '.version' "$TERMAN_RELEASE_DIR/metadata.json")
          for arch in amd64 arm64; do
            suffix="-$arch"
            for tool in screen tmux htop; do
              image="ghcr.io/lyonbrown4d/terman-$tool:v$version$suffix"
              docker run --rm --platform "linux/$arch" "$image" --version | grep -F "$version"
            done
            docker run --rm --init --platform "linux/$arch" --entrypoint /bin/sh \
              "ghcr.io/lyonbrown4d/terman-screen:v$version$suffix" -ec \
              'terman-screen -d -S release-test --command "sleep 30"; terman-screen -S release-test -X info; terman-screen -S release-test -X quit'
            docker run --rm --init --platform "linux/$arch" --entrypoint /bin/sh \
              "ghcr.io/lyonbrown4d/terman-tmux:v$version$suffix" -ec \
              'terman-tmux new-session -d -s release-test "sleep 30"; terman-tmux list-sessions; terman-tmux kill-session -t release-test'
            docker run --rm --platform "linux/$arch" \
              "ghcr.io/lyonbrown4d/terman-htop:v$version$suffix" --once >/dev/null
      - name: Validate actual Linux installer payloads without host changes
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          bash packaging/tests/check-linux-packages.sh "$TERMAN_RELEASE_DIR"
      - name: Explain MSI license configuration
        if: vars.TERMAN_ACCEPT_WIX_EULA != 'true'
        shell: bash
        run: echo '::notice title=MSI build skipped::WiX 7 requires organization EULA acceptance. After reviewing https://docs.firegiant.com/wix/osmf/, set repository variable TERMAN_ACCEPT_WIX_EULA=true to enable MSI builds.'
      - name: Publish verified release configuration
        if: startsWith(github.ref, 'refs/tags/v')
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: terman-packages
          if-no-files-found: error
          path: |
            ${{ env.TERMAN_RELEASE_DIR }}/*.zip
            ${{ env.TERMAN_RELEASE_DIR }}/*.tar.gz
            ${{ env.TERMAN_RELEASE_DIR }}/*.deb
            ${{ env.TERMAN_RELEASE_DIR }}/*.rpm
            ${{ env.TERMAN_RELEASE_DIR }}/*checksums.txt
            ${{ env.TERMAN_RELEASE_DIR }}/metadata.json

  msi:
    needs: packages
    if: vars.TERMAN_ACCEPT_WIX_EULA == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Initialize external MSI output directory
        shell: pwsh
        run: '"TERMAN_RELEASE_DIR=$(Join-Path $env:RUNNER_TEMP ''terman-release'')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8'
      - uses: actions/download-artifact@v5
        with:
          name: terman-packages
          path: ${{ env.TERMAN_RELEASE_DIR }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install UPX and WiX 7 outside the repository
        shell: pwsh
        run: |
          ./packaging/windows/Install-Upx.ps1
          $tools = Join-Path $env:RUNNER_TEMP 'wix-tools'
          dotnet tool install wix --version 7.0.0 --tool-path $tools
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          & (Join-Path $tools 'wix.exe') extension add -acceptEula wix7 -g WixToolset.Util.wixext/7.0.0
          if ($LASTEXITCODE -ne 0) { throw 'WiX extension installation failed' }
          $tools | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compile MSI from compressed GoReleaser ZIP and validate native tables
        shell: pwsh
        env:
          TERMAN_MSI_ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/Build-Msi.ps1 -ReleaseDirectory $env:TERMAN_RELEASE_DIR -Architecture $env:TERMAN_MSI_ARCH -AcceptWixEula
      - name: Real native MSI lifecycle (explicit host-change opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.installer_lifecycle
        shell: pwsh
        env:
          TERMAN_MSI_ARCH: ${{ matrix.arch }}
        run: |
          ./packaging/windows/Build-Msi.ps1 -ReleaseDirectory $env:TERMAN_RELEASE_DIR -Architecture $env:TERMAN_MSI_ARCH -Version 0.0.1 -AcceptWixEula
          $old = Get-ChildItem $env:TERMAN_RELEASE_DIR -Filter '*.msi' | Select-Object -First 1
          $oldPath = Join-Path $env:RUNNER_TEMP 'terman-previous.msi'
          Copy-Item -LiteralPath $old.FullName -Destination $oldPath
          ./packaging/windows/Build-Msi.ps1 -ReleaseDirectory $env:TERMAN_RELEASE_DIR -Architecture $env:TERMAN_MSI_ARCH -Version 0.0.2 -AcceptWixEula
          ./packaging/tests/windows-lifecycle.ps1 -PreviousMsi $oldPath -Msi $old.FullName -AllowHostChanges
          ./packaging/windows/Build-Msi.ps1 -ReleaseDirectory $env:TERMAN_RELEASE_DIR -Architecture $env:TERMAN_MSI_ARCH -AcceptWixEula
      - uses: actions/upload-artifact@v4
        with:
          name: terman-msi-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ env.TERMAN_RELEASE_DIR }}/*.msi
            ${{ env.TERMAN_RELEASE_DIR }}/*.msi.sha256
      - name: Publish verified MSI to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TERMAN_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem $env:TERMAN_RELEASE_DIR -File | Where-Object Name -match '\.msi(\.sha256)?$'
          gh release upload $env:TERMAN_RELEASE_TAG @($files.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'MSI upload failed' }

  linux-installer-lifecycle:
    needs: packages
    if: github.event_name == 'workflow_dispatch' && inputs.installer_lifecycle
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Initialize external Linux fixture directories
        shell: bash
        run: printf 'TERMAN_RELEASE_DIR=%s/terman-release\nTERMAN_FIXTURE_DIR=%s/terman-package-fixtures\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - uses: actions/download-artifact@v5
        with:
          name: terman-packages
          path: ${{ env.TERMAN_RELEASE_DIR }}
      - uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4
        with:
          install-only: true
          version: latest
      - name: Build increasing-version fixtures from release binaries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          bash packaging/tests/build-linux-fixtures.sh "$TERMAN_RELEASE_DIR" "$TERMAN_FIXTURE_DIR"
      - name: Real package install, user broker, upgrade and removal
        shell: bash
        env:
          TERMAN_PACKAGE_FORMAT: ${{ matrix.format }}
        run: sudo env TERMAN_INSTALLER_TEST_ALLOW_HOST_CHANGES=1 bash packaging/tests/linux-lifecycle.sh "$TERMAN_FIXTURE_DIR/0.0.1" "$TERMAN_FIXTURE_DIR/0.0.2" "$TERMAN_PACKAGE_FORMAT"
